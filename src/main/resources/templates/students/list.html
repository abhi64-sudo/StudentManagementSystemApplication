<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Students</h2>
        <a href="/students/new" class="btn btn-primary"><i class="bi bi-person-plus-fill me-1"></i>Add Student</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form action="/students" method="get" class="d-flex gap-2 mb-4">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control"
               placeholder="Search by name, email or course...">
        <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> Search</button>
        <a href="/students" class="btn btn-outline-secondary">Clear</a>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7" class="text-center text-muted py-4">No students found.</td>
                    </tr>
                    <tr th:each="student, iter : ${students}">
                        <td th:text="${iter.count}">1</td>
                        <td th:text="${student.name}">Name</td>
                        <td th:text="${student.email}">email@example.com</td>
                        <td th:text="${student.phone}">0000000000</td>
                        <td th:text="${student.course}">Course</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${student.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${student.status}">ACTIVE</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-outline-info" title="View">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-sm btn-outline-warning" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this student? This cannot be undone.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
