<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Details')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Student Details</h2>
        <div>
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-outline-warning">
                <i class="bi bi-pencil me-1"></i>Edit
            </a>
            <a href="/students" class="btn btn-outline-secondary">Back to List</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Name</dt>
                <dd class="col-sm-9" th:text="${student.name}"></dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${student.email}"></dd>

                <dt class="col-sm-3">Phone</dt>
                <dd class="col-sm-9" th:text="${student.phone}"></dd>

                <dt class="col-sm-3">Course</dt>
                <dd class="col-sm-9" th:text="${student.course}"></dd>

                <dt class="col-sm-3">Department</dt>
                <dd class="col-sm-9" th:text="${student.department} ?: '-'"></dd>

                <dt class="col-sm-3">Gender</dt>
                <dd class="col-sm-9" th:text="${student.gender} ?: '-'"></dd>

                <dt class="col-sm-3">Date of Birth</dt>
                <dd class="col-sm-9" th:text="${student.dob} ?: '-'"></dd>

                <dt class="col-sm-3">Address</dt>
                <dd class="col-sm-9" th:text="${student.address} ?: '-'"></dd>

                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9">
                    <span class="badge" th:classappend="${student.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${student.status}"></span>
                </dd>

                <dt class="col-sm-3">Created</dt>
                <dd class="col-sm-9" th:text="${student.createdDate}"></dd>

                <dt class="col-sm-3">Last Updated</dt>
                <dd class="col-sm-9" th:text="${student.updatedDate}"></dd>
            </dl>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
