<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-people-fill"></i></div>
                    <div class="ms-3">
                        <div class="text-muted small">Total Students</div>
                        <div class="fs-3 fw-bold" th:text="${stats.totalStudents}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-check-circle-fill"></i></div>
                    <div class="ms-3">
                        <div class="text-muted small">Active Students</div>
                        <div class="fs-3 fw-bold" th:text="${stats.activeStudents}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <div class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-person-plus-fill"></i></div>
                    <div class="ms-3">
                        <div class="text-muted small">New Admissions (30 days)</div>
                        <div class="fs-3 fw-bold" th:text="${stats.newAdmissions}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Quick Search</h5>
            <form action="/students" method="get" class="d-flex gap-2">
                <input type="text" name="keyword" class="form-control" placeholder="Search by name, email or course...">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Search</button>
            </form>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <a href="/students" class="btn btn-outline-primary"><i class="bi bi-list-ul me-1"></i>View All Students</a>
        <a href="/students/new" class="btn btn-primary"><i class="bi bi-person-plus-fill me-1"></i>Add Student</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
